<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Background Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="whiteboard"></canvas>
    <div id="side-panel">
        <div id="arrow"></div>
        <div id="inner">
            <label for="cursor">Select Cursor Mode:</label>
            <select name="cursor" id="cursor">
                <option value="random">Random</option>
                <option value="none">None</option>
                <option value="click-dots">Click Circles</option>
                <option value="hold-dots">Hold Circles</option>
                <option value="flashlight">Flashlight</option>
                <option value="expel">Expel</option>
                <option value="slow-drift">Slow Drift</option>
                <option value="constellations">Constellations</option>
            </select>
            <label for="background">Select Background:</label>
            <select name="background" id="background">
                <option value="random">Random</option>
                <option value="black">black</option>
                <option value="white">white</option>
                <option value="primary">Primary</option>
                <option value="secondary">Secondary</option>
                <option value="checkerboard">Checkerboard</option>
                <option value="random-dots">Random Dots</option>
                <option value="particles">Particles</option>
                <option value="random-constellations">Random Constellations</option>
            </select>

            <label for="primary-color">Select Primary Color:</label>
            <input type="color" id="primary-color" name="primary-color" value="##2F00FF">
                
            <label for="secondary-color">Select Secondary Color:</label>
            <input type="color" id="secondary-color" name="secondary-color" value="#ffffff">

            <label for="background-color">Select Background Color:</label>
            <input type="color" id="background-color" name="background-color" value="#000000">
        </div>
    </div>
    <script type="module" src="./scripts/main.js"></script>
    <script type="module" src="./scripts/input.js"></script>
</body>
</html>
